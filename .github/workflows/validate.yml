name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python scripts/validate_skill.py
      - run: python -I benchmark/test_checks.py
      - run: python -I benchmark/test_run_benchmark.py
      - run: python -I scripts/test_validate_skill.py
      - run: python -I scripts/test_audit_history.py

  starter-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test bin/test_cli.mjs
      - run: node --test one-shot/scripts/test_verify.mjs
      - run: node --test benchmark-v3/starters/09-notes-app/tests/notes.test.js
      - name: Verify spec-09 starter manifest integrity
        run: |
          out=$(python -I benchmark/checks.py --spec 09 --dir benchmark-v3/starters/09-notes-app)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "02 PASS   7/7 manifest files byte-identical"
