<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskbox</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    li { display: flex; gap: .5rem; align-items: center; padding: .25rem 0; }
    li.done span.title { text-decoration: line-through; color: #666; }
    .due { color: #555; font-size: .85rem; }
    li.overdue { background: #fef2f2; border-radius: .25rem; padding: .25rem .5rem; }
    .due-badge { background: #b91c1c; color: #fff; font-size: .75rem; padding: .1rem .5rem; border-radius: 999px; }
    #bar { display: flex; gap: .5rem; align-items: center; }
  </style>
</head>
<body>
  <h1>Taskbox</h1>
  <form id="add"><input id="title" placeholder="New task" required><input id="due" type="date" aria-label="Due date"><button>Add</button></form>
  <p id="bar"><label for="status">Show</label>
    <select id="status">
      <option value="">all</option>
      <option value="open">open</option>
      <option value="done">done</option>
    </select>
  </p>
  <ul id="list"></ul>
  <script>
    const todayUTC = () => new Date().toISOString().slice(0, 10);

    async function load() {
      // C5: the dropdown drives the status filter on the API.
      const filter = document.getElementById("status").value;
      const qs = filter ? "?status=" + encodeURIComponent(filter) : "";
      const tasks = await (await fetch("/api/tasks" + qs)).json();
      const today = todayUTC();
      const ul = document.getElementById("list");
      ul.innerHTML = "";
      for (const t of tasks) {
        const li = document.createElement("li");
        const overdue = !t.done && t.due !== null && t.due !== undefined && t.due < today;
        if (t.done) li.className = "done";
        if (overdue) li.classList.add("overdue");

        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = t.done;
        cb.onchange = async () => { await fetch("/api/tasks/" + t.id, { method: "PATCH", body: JSON.stringify({ done: cb.checked }) }); load(); };
        const span = document.createElement("span"); span.className = "title"; span.textContent = t.title;
        li.append(cb, span);

        if (t.due) {
          const due = document.createElement("span");
          due.className = "due";
          due.textContent = "due " + t.due;
          li.append(due);
        }
        if (overdue) {
          const badge = document.createElement("span");
          badge.className = "due-badge";
          badge.textContent = "overdue";
          li.append(badge);
        }

        const del = document.createElement("button"); del.textContent = "Delete";
        del.onclick = async () => { await fetch("/api/tasks/" + t.id, { method: "DELETE" }); load(); };
        li.append(del); ul.append(li);
      }
    }

    document.getElementById("status").onchange = load;
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      const dueInput = document.getElementById("due");
      const body = { title: input.value };
      if (dueInput.value) body.due = dueInput.value;
      await fetch("/api/tasks", { method: "POST", body: JSON.stringify(body) });
      input.value = ""; dueInput.value = ""; load();
    };
    load();
  </script>
</body>
</html>
