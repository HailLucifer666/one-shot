<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskbox</title>
  <style>
    html { color-scheme: light; }
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; background: #fff; color: #222; }
    li { display: flex; gap: .5rem; align-items: center; padding: .25rem 0; }
    li.done span { text-decoration: line-through; color: #666; }
    .due { color: #555; font-size: .85rem; }
    li.overdue { background: #fef2f2; border-radius: .25rem; padding: .25rem .4rem; }
    li.overdue .due { color: #991b1b; font-weight: 600; }
    .badge { background: #fee2e2; color: #991b1b; font-size: .75rem; padding: .05rem .45rem; border-radius: 999px; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; }
    #title { flex: 1 1 8rem; }
  </style>
</head>
<body>
  <h1>Taskbox</h1>
  <form id="add">
    <input id="title" placeholder="New task" required>
    <input id="due" type="date" aria-label="Due date">
    <button>Add</button>
  </form>
  <p>
    <label for="filter">Show</label>
    <select id="filter">
      <option value="all">all</option>
      <option value="open">open</option>
      <option value="done">done</option>
    </select>
  </p>
  <ul id="list"></ul>
  <script>
    const filter = document.getElementById("filter");

    async function load() {
      const q = filter.value === "all" ? "" : "?status=" + encodeURIComponent(filter.value);
      const tasks = await (await fetch("/api/tasks" + q)).json();
      // UTC date, the same rule the API uses for the overdue filter
      const today = new Date().toISOString().slice(0, 10);
      const ul = document.getElementById("list");
      ul.innerHTML = "";
      for (const t of tasks) {
        const overdue = !t.done && t.due && t.due < today;
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        if (overdue) li.className += " overdue";
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = t.done;
        cb.onchange = async () => { await fetch("/api/tasks/" + t.id, { method: "PATCH", body: JSON.stringify({ done: cb.checked }) }); load(); };
        const span = document.createElement("span"); span.textContent = t.title;
        li.append(cb, span);
        if (t.due) {
          const due = document.createElement("span");
          due.className = "due"; due.textContent = "due " + t.due;
          li.append(due);
        }
        if (overdue) {
          const badge = document.createElement("span");
          badge.className = "badge"; badge.textContent = "overdue";
          li.append(badge);
        }
        const del = document.createElement("button"); del.textContent = "Delete";
        del.onclick = async () => { await fetch("/api/tasks/" + t.id, { method: "DELETE" }); load(); };
        li.append(del); ul.append(li);
      }
    }

    filter.onchange = load;

    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      const dueInput = document.getElementById("due");
      const res = await fetch("/api/tasks", { method: "POST", body: JSON.stringify({ title: input.value, due: dueInput.value || null }) });
      if (!res.ok) alert((await res.json()).error || "could not add the task");
      input.value = ""; dueInput.value = ""; load();
    };
    load();
  </script>
</body>
</html>
