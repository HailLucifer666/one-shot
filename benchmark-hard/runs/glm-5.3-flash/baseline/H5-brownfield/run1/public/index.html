<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskbox</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    li { display: flex; gap: .5rem; align-items: center; padding: .25rem 0; }
    li.done span.title { text-decoration: line-through; color: #666; }
    li.overdue { background: #fdecea; border-radius: .25rem; padding: .25rem .375rem; }
    li.overdue span.title { color: #b3261e; font-weight: 600; }
    .due { margin-left: auto; font-size: .8rem; color: #555; white-space: nowrap; }
    li.overdue .due { color: #b3261e; }
    .row { display: flex; gap: .5rem; align-items: center; margin: .5rem 0; }
    .row input[type="text"] { flex: 1; }
  </style>
</head>
<body>
  <h1>Taskbox</h1>
  <form id="add" class="row">
    <input id="title" type="text" placeholder="New task" required>
    <input id="due" type="date" aria-label="Due date">
    <button>Add</button>
  </form>
  <div class="row">
    <label for="filter">Show:</label>
    <select id="filter">
      <option value="">all</option>
      <option value="open">open</option>
      <option value="done">done</option>
    </select>
  </div>
  <ul id="list"></ul>
  <script>
    // Same definition as the server: overdue = not done and due before
    // today's UTC date.
    function isOverdue(t) {
      return !t.done && t.due !== null && t.due < new Date().toISOString().slice(0, 10);
    }
    async function load() {
      const filter = document.getElementById("filter").value;
      const qs = filter ? "?status=" + encodeURIComponent(filter) : "";
      const tasks = await (await fetch("/api/tasks" + qs)).json();
      const ul = document.getElementById("list");
      ul.innerHTML = "";
      for (const t of tasks) {
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        if (isOverdue(t)) li.className += " overdue";
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = t.done;
        cb.onchange = async () => { await fetch("/api/tasks/" + t.id, { method: "PATCH", body: JSON.stringify({ done: cb.checked }) }); load(); };
        const span = document.createElement("span"); span.className = "title"; span.textContent = t.title;
        const due = document.createElement("span"); due.className = "due";
        due.textContent = t.due ? "due " + t.due + (isOverdue(t) ? " (overdue)" : "") : "";
        const del = document.createElement("button"); del.textContent = "Delete";
        del.onclick = async () => { await fetch("/api/tasks/" + t.id, { method: "DELETE" }); load(); };
        li.append(cb, span, due, del); ul.append(li);
      }
    }
    document.getElementById("filter").onchange = load;
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      const dueInput = document.getElementById("due");
      const body = { title: input.value };
      if (dueInput.value) body.due = dueInput.value;
      await fetch("/api/tasks", { method: "POST", body: JSON.stringify(body) });
      input.value = ""; dueInput.value = ""; load();
    };
    load();
  </script>
</body>
</html>
